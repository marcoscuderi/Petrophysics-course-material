    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

  position: absolute;
  top: 50%;
  left: 0;

  height: 16px;

}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {

}

}

.form-range::-webkit-slider-runnable-track {
  height: 28px;

}

.form-range::-webkit-slider-thumb {
  appearance: none;

  height: 20px;
  margin-top: 4px;

  border-radius: var(--radius-full);

}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],

  border-color: var(--primary);

}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {

  .form-control,
  .form-select {

    min-height: 44px;

  }

    height: 44px;

  }

  .form-range::-moz-range-track {

  }

}

svg {

  height: auto;
}

#widget &gt; svg {

}

}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    &quot;message&quot;,

  &lt;section id=&quot;l8-mohr-panel&quot; class=&quot;l8-panel&quot; hidden&gt;
    &lt;div class=&quot;l8-intro&quot;&gt;
      &lt;div&gt;

        &lt;p class=&quot;text-muted&quot;&gt;First hold differential stress fixed. Then compare the measured failure states.&lt;/p&gt;

      &lt;div class=&quot;l8-mode&quot; role=&quot;group&quot; aria-label=&quot;Mohr activity mode&quot;&gt;
        &lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot; id=&quot;l8-mode-load&quot; aria-pressed=&quot;true&quot;&gt;Explore loading&lt;/button&gt;
        &lt;button type=&quot;button&quot; class=&quot;btn btn-secondary&quot; id=&quot;l8-mode-compare&quot; aria-pressed=&quot;false&quot;&gt;Compare failures&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;l8-mohr-controls&quot; id=&quot;l8-load-controls&quot;&gt;
      &lt;div class=&quot;l8-control-block&quot;&gt;
        &lt;label class=&quot;form-label&quot; for=&quot;l8-pc&quot;&gt;Confining pressure &lt;em&gt;P&lt;/em&gt;&lt;sub&gt;c&lt;/sub&gt; = σ&lt;sub&gt;3&lt;/sub&gt;: &lt;strong class=&quot;tabular-nums&quot;&gt;&lt;span id=&quot;l8-pc-value&quot;&gt;50&lt;/span&gt; MPa&lt;/strong&gt;&lt;/label&gt;
        &lt;input class=&quot;form-range&quot; id=&quot;l8-pc&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;200&quot; step=&quot;10&quot; value=&quot;50&quot;&gt;
        &lt;div class=&quot;l8-range-labels&quot;&gt;&lt;span&gt;0&lt;/span&gt;&lt;span&gt;100&lt;/span&gt;&lt;span&gt;200 MPa&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;l8-control-block&quot;&gt;
        &lt;label class=&quot;form-label&quot; for=&quot;l8-q&quot;&gt;Differential stress &lt;em&gt;q&lt;/em&gt; = σ&lt;sub&gt;1&lt;/sub&gt; − σ&lt;sub&gt;3&lt;/sub&gt;: &lt;strong class=&quot;tabular-nums&quot;&gt;&lt;span id=&quot;l8-q-value&quot;&gt;250&lt;/span&gt; MPa&lt;/strong&gt;&lt;/label&gt;
        &lt;input class=&quot;form-range&quot; id=&quot;l8-q&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;1050&quot; step=&quot;5&quot; value=&quot;250&quot;&gt;
        &lt;div class=&quot;l8-range-labels&quot;&gt;&lt;span&gt;0&lt;/span&gt;&lt;span&gt;525&lt;/span&gt;&lt;span&gt;1050 MPa&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn btn-outline-secondary&quot; id=&quot;l8-to-failure&quot;&gt;Jump to measured failure at nearest tested &lt;em&gt;P&lt;/em&gt;&lt;sub&gt;c&lt;/sub&gt;&lt;/button&gt;
    &lt;/div&gt;

    &lt;div class=&quot;l8-compare-controls&quot; id=&quot;l8-compare-controls&quot; hidden&gt;

        &lt;label class=&quot;form-check&quot;&gt;&lt;input class=&quot;form-check-input l8-circle-check&quot; type=&quot;checkbox&quot; value=&quot;50&quot; checked&gt;&lt;span class=&quot;form-check-label&quot;&gt;50 MPa&lt;/span&gt;&lt;/label&gt;
        &lt;label class=&quot;form-check&quot;&gt;&lt;input class=&quot;form-check-input l8-circle-check&quot; type=&quot;checkbox&quot; value=&quot;100&quot;&gt;&lt;span class=&quot;form-check-label&quot;&gt;100 MPa&lt;/span&gt;&lt;/label&gt;
        &lt;label class=&quot;form-check&quot;&gt;&lt;input class=&quot;form-check-input l8-circle-check&quot; type=&quot;checkbox&quot; value=&quot;150&quot;&gt;&lt;span class=&quot;form-check-label&quot;&gt;150 MPa&lt;/span&gt;&lt;/label&gt;
        &lt;label class=&quot;form-check&quot;&gt;&lt;input class=&quot;form-check-input l8-circle-check&quot; type=&quot;checkbox&quot; value=&quot;200&quot; checked&gt;&lt;span class=&quot;form-check-label&quot;&gt;200 MPa&lt;/span&gt;&lt;/label&gt;
      &lt;/div&gt;
      &lt;div class=&quot;table-responsive l8-measured-table&quot;&gt;
        &lt;table class=&quot;table table-sm&quot;&gt;
          &lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;em&gt;P&lt;/em&gt;&lt;sub&gt;c&lt;/sub&gt; (MPa)&lt;/th&gt;&lt;th class=&quot;text-end&quot;&gt;Test 1&lt;/th&gt;&lt;th class=&quot;text-end&quot;&gt;Test 2&lt;/th&gt;&lt;th class=&quot;text-end&quot;&gt;Test 3&lt;/th&gt;&lt;th class=&quot;text-end&quot;&gt;Test 4&lt;/th&gt;&lt;th class=&quot;text-end&quot;&gt;Mean &lt;em&gt;q&lt;/em&gt;&lt;sub&gt;peak&lt;/sub&gt;&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
          &lt;tbody&gt;
            &lt;tr&gt;&lt;th&gt;50&lt;/th&gt;&lt;td class=&quot;text-end&quot;&gt;543.2&lt;/td&gt;&lt;td class=&quot;text-end&quot;&gt;545.9&lt;/td&gt;&lt;td class=&quot;text-end&quot;&gt;527.6&lt;/td&gt;&lt;td class=&quot;text-end&quot;&gt;518.3&lt;/td&gt;&lt;td class=&quot;text-end&quot;&gt;533.75&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;th&gt;100&lt;/th&gt;&lt;td class=&quot;text-end&quot;&gt;737.2&lt;/td&gt;&lt;td class=&quot;text-end&quot;&gt;737.5&lt;/td&gt;&lt;td class=&quot;text-end&quot;&gt;709.2&lt;/td&gt;&lt;td class=&quot;text-end&quot;&gt;716.5&lt;/td&gt;&lt;td class=&quot;text-end&quot;&gt;725.10&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;th&gt;150&lt;/th&gt;&lt;td class=&quot;text-end&quot;&gt;899.2&lt;/td&gt;&lt;td class=&quot;text-end&quot;&gt;897.1&lt;/td&gt;&lt;td class=&quot;text-end&quot;&gt;877.1&lt;/td&gt;&lt;td class=&quot;text-end&quot;&gt;862.6&lt;/td&gt;&lt;td class=&quot;text-end&quot;&gt;884.00&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;th&gt;200&lt;/th&gt;&lt;td class=&quot;text-end&quot;&gt;1028.4&lt;/td&gt;&lt;td class=&quot;text-end&quot;&gt;1037.6&lt;/td&gt;&lt;td class=&quot;text-end&quot;&gt;996.7&lt;/td&gt;&lt;td class=&quot;text-end&quot;&gt;993.3&lt;/td&gt;&lt;td class=&quot;text-end&quot;&gt;1014.00&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;
        &lt;/table&gt;
      &lt;/div&gt;
      &lt;p class=&quot;text-small text-muted l8-data-note&quot;&gt;Measured: &lt;em&gt;P&lt;/em&gt;&lt;sub&gt;c&lt;/sub&gt; and the 16 individual &lt;em&gt;q&lt;/em&gt;&lt;sub&gt;peak&lt;/sub&gt; values. Means, Mohr-circle coordinates and failure-plane stresses are calculated from them.&lt;/p&gt;
    &lt;/div&gt;

    &lt;div class=&quot;l8-live-values&quot; id=&quot;l8-live-values&quot; aria-live=&quot;polite&quot;&gt;
      &lt;span&gt;σ&lt;sub&gt;3&lt;/sub&gt; &lt;strong id=&quot;l8-s3&quot;&gt;50&lt;/strong&gt; MPa&lt;/span&gt;
      &lt;span&gt;σ&lt;sub&gt;1&lt;/sub&gt; &lt;strong id=&quot;l8-s1&quot;&gt;300&lt;/strong&gt; MPa&lt;/span&gt;
      &lt;span&gt;Centre &lt;strong id=&quot;l8-centre&quot;&gt;175&lt;/strong&gt; MPa&lt;/span&gt;
      &lt;span&gt;Radius &lt;strong id=&quot;l8-radius&quot;&gt;125&lt;/strong&gt; MPa&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;l8-failure-values&quot; id=&quot;l8-failure-values&quot; hidden aria-live=&quot;polite&quot;&gt;
      &lt;span&gt;Measured failure state reached&lt;/span&gt;
      &lt;strong&gt;Inferred plane stresses:&lt;/strong&gt;
      &lt;span&gt;σ&lt;sub&gt;n,f&lt;/sub&gt; = &lt;strong id=&quot;l8-snf&quot;&gt;—&lt;/strong&gt; MPa&lt;/span&gt;
      &lt;span&gt;τ&lt;sub&gt;f&lt;/sub&gt; = &lt;strong id=&quot;l8-tauf&quot;&gt;—&lt;/strong&gt; MPa&lt;/span&gt;
      &lt;span&gt;plane angle α = &lt;strong id=&quot;l8-alpha-live&quot;&gt;—&lt;/strong&gt;° to σ&lt;sub&gt;1&lt;/sub&gt;&lt;/span&gt;
    &lt;/div&gt;

    &lt;div class=&quot;l8-linked-views&quot;&gt;
      &lt;div class=&quot;l8-mini-view&quot;&gt;
        &lt;h3&gt;Specimen&lt;/h3&gt;
        &lt;svg id=&quot;l8-specimen&quot; viewBox=&quot;0 0 240 280&quot; role=&quot;img&quot; aria-label=&quot;Triaxial specimen with axial and confining stress arrows&quot;&gt;&lt;/svg&gt;
      &lt;/div&gt;
      &lt;div class=&quot;l8-mini-view l8-stress-view&quot;&gt;
        &lt;h3&gt;Loading components&lt;/h3&gt;
        &lt;div class=&quot;l8-svg-wrap&quot; id=&quot;l8-stress-wrap&quot;&gt;&lt;svg id=&quot;l8-stress-chart&quot; role=&quot;img&quot; aria-label=&quot;Principal stress components during loading&quot;&gt;&lt;/svg&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;l8-mini-view l8-circle-view&quot;&gt;
        &lt;div class=&quot;l8-chart-head&quot;&gt;
          &lt;h3&gt;Mohr diagram&lt;/h3&gt;
          &lt;label class=&quot;form-check form-switch&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot; id=&quot;l8-envelope&quot;&gt;&lt;span class=&quot;form-check-label&quot;&gt;Fit failure envelope&lt;/span&gt;&lt;/label&gt;
        &lt;/div&gt;
        &lt;div class=&quot;l8-svg-wrap&quot; id=&quot;l8-mohr-wrap&quot;&gt;
          &lt;svg id=&quot;l8-mohr-chart&quot; role=&quot;img&quot; aria-labelledby=&quot;l8-mohr-title l8-mohr-desc&quot;&gt;&lt;title id=&quot;l8-mohr-title&quot;&gt;Mohr circle for the selected stress state&lt;/title&gt;&lt;desc id=&quot;l8-mohr-desc&quot;&gt;Normal and shear stress axes have exactly the same scale per megapascal.&lt;/desc&gt;&lt;/svg&gt;
          &lt;div class=&quot;l8-tooltip&quot; id=&quot;l8-mohr-tooltip&quot; role=&quot;tooltip&quot; hidden&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;l8-envelope-controls&quot; id=&quot;l8-envelope-controls&quot; hidden&gt;
      &lt;div class=&quot;l8-control-block&quot;&gt;
        &lt;label class=&quot;form-label&quot; for=&quot;l8-c&quot;&gt;Cohesion &lt;em&gt;c&lt;/em&gt;: &lt;strong&gt;&lt;span id=&quot;l8-c-value&quot;&gt;95&lt;/span&gt; MPa&lt;/strong&gt;&lt;/label&gt;
        &lt;input class=&quot;form-range&quot; id=&quot;l8-c&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;200&quot; step=&quot;5&quot; value=&quot;95&quot;&gt;
      &lt;/div&gt;
      &lt;div class=&quot;l8-control-block&quot;&gt;
        &lt;label class=&quot;form-label&quot; for=&quot;l8-phi&quot;&gt;Friction angle φ: &lt;strong&gt;&lt;span id=&quot;l8-phi-value&quot;&gt;38&lt;/span&gt;°&lt;/strong&gt; · friction μ = tanφ = &lt;strong&gt;&lt;span id=&quot;l8-mu-value&quot;&gt;0.78&lt;/span&gt;&lt;/strong&gt;&lt;/label&gt;
        &lt;input class=&quot;form-range&quot; id=&quot;l8-phi&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;50&quot; step=&quot;1&quot; value=&quot;38&quot;&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;button type=&quot;button&quot; class=&quot;btn btn-outline-secondary&quot; id=&quot;l8-use-fit&quot;&gt;Use fit to measured means&lt;/button&gt;
        &lt;p class=&quot;text-muted&quot;&gt;The fitted starting values are &lt;em&gt;c&lt;/em&gt; ≈ 95 MPa, φ ≈ 38°, μ ≈ 0.78. The specimen shows α = 45° − φ/2.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;l8-synthesis&quot;&gt;
      &lt;div class=&quot;l8-callout&quot; id=&quot;l8-mohr-insight&quot; aria-live=&quot;polite&quot;&gt;&lt;strong&gt;Fixed &lt;em&gt;q&lt;/em&gt;:&lt;/strong&gt; changing &lt;em&gt;P&lt;/em&gt;&lt;sub&gt;c&lt;/sub&gt; moves the centre but leaves the radius unchanged.&lt;/div&gt;
      &lt;label class=&quot;form-label&quot; for=&quot;l8-explain&quot;&gt;Explain the difference between translating and enlarging a circle&lt;/label&gt;
      &lt;textarea class=&quot;form-control&quot; id=&quot;l8-explain&quot; rows=&quot;2&quot; placeholder=&quot;At fixed q… At measured failure…&quot;&gt;&lt;/textarea&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;footer class=&quot;l8-source&quot;&gt;Data: Lockner (1998), Table 3, JGR 103, 5107–5123. Stress conventions follow Paterson &amp;amp; Wong, &lt;em&gt;Experimental Rock Deformation: The Brittle Field&lt;/em&gt;.&lt;/footer&gt;
