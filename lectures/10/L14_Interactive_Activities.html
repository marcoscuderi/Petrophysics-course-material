      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

  &lt;script&gt;
  (() =&gt; {
    const root=document.getElementById(&#x27;ae-lab-v2&#x27;);
    const NS=&#x27;http://www.w3.org/2000/svg&#x27;;
    const E=(tag,a={},text=&#x27;&#x27;)=&gt;{const n=document.createElementNS(NS,tag);Object.entries(a).forEach(([k,v])=&gt;n.setAttribute(k,v));if(text)n.textContent=text;return n};
    const clamp=(v,a,b)=&gt;Math.max(a,Math.min(b,v));
    const fmt=(v,n=2)=&gt;Number(v).toFixed(n).replace(&#x27;-&#x27;, &#x27;−&#x27;);
    const path=pts=&gt;pts.map((p,i)=&gt;(i?&#x27;L&#x27;:&#x27;M&#x27;)+p[0].toFixed(1)+&#x27;,&#x27;+p[1].toFixed(1)).join(&#x27; &#x27;);

    // Host tabs are mirrored locally so the prototype also works as a plain fragment.
    const locTab=root.querySelector(&#x27;#loc-tab-v2&#x27;), bTab=root.querySelector(&#x27;#b-tab-v2&#x27;), staTab=root.querySelector(&#x27;#sta-tab-v3&#x27;);
    function activate(which){const loc=which===&#x27;loc&#x27;,b=which===&#x27;b&#x27;,sta=which===&#x27;sta&#x27;;locTab.classList.toggle(&#x27;active&#x27;,loc);bTab.classList.toggle(&#x27;active&#x27;,b);staTab.classList.toggle(&#x27;active&#x27;,sta);locTab.setAttribute(&#x27;aria-selected&#x27;,loc);bTab.setAttribute(&#x27;aria-selected&#x27;,b);staTab.setAttribute(&#x27;aria-selected&#x27;,sta);root.querySelector(&#x27;#loc-panel-v2&#x27;).hidden=!loc;root.querySelector(&#x27;#b-panel-v2&#x27;).hidden=!b;root.querySelector(&#x27;#sta-panel-v3&#x27;).hidden=!sta;if(b)drawB();if(sta&amp;&amp;window.drawNewSTALab)window.drawNewSTALab();}
    locTab.addEventListener(&#x27;click&#x27;,()=&gt;activate(&#x27;loc&#x27;));bTab.addEventListener(&#x27;click&#x27;,()=&gt;activate(&#x27;b&#x27;));staTab.addEventListener(&#x27;click&#x27;,()=&gt;activate(&#x27;sta&#x27;));

    // ---------- Localization: pick -&gt; distance -&gt; intersection -&gt; model ----------
    const trueVp=5.2,trueVs=3.0,t0=4.2;
    const sensorsMM=[{id:&#x27;S1&#x27;,x:0,y:20},{id:&#x27;S2&#x27;,x:0,y:78},{id:&#x27;S3&#x27;,x:50,y:28},{id:&#x27;S4&#x27;,x:50,y:86}];
    const sourceMM={x:29,y:58};
    const dTrue=sensorsMM.map(s=&gt;Math.hypot(s.x-sourceMM.x,s.y-sourceMM.y));
    const arrivals=sensorsMM.map((s,i)=&gt;({p:t0+dTrue[i]/trueVp,s:t0+dTrue[i]/trueVs}));
    let picks=arrivals.map((a,i)=&gt;({p:a.p+[.55,-.42,.68,-.35][i],s:a.s+[-.62,.48,-.55,.72][i]}));
    let stage=1,estimate=null,cloud=[],reveal=false;

    function setStage(n){stage=n;root.querySelectorAll(&#x27;[data-stage]&#x27;).forEach(b=&gt;{const on=+b.dataset.stage===n;b.setAttribute(&#x27;aria-pressed&#x27;,on);b.classList.toggle(&#x27;btn-primary&#x27;,on)});root.querySelector(&#x27;#distance-box-v2&#x27;).hidden=n&lt;2||n&gt;3;root.querySelector(&#x27;#solve-controls-v2&#x27;).hidden=n&lt;3;root.querySelector(&#x27;#model-box-v2&#x27;).hidden=n!==4;drawLoc();const msg={1:&#x27;Drag both arrival picks on each trace, then check them.&#x27;,2:&#x27;The P–S separation removes origin time and gives one source–sensor distance.&#x27;,3:&#x27;Each sensor adds a distance circle. Solve their best intersection.&#x27;,4:&#x27;Change velocity, attenuation or noise and inspect what changes.&#x27;};root.querySelector(&#x27;#loc-status-v2&#x27;).textContent=msg[n];}
    root.querySelectorAll(&#x27;[data-stage]&#x27;).forEach(b=&gt;b.addEventListener(&#x27;click&#x27;,()=&gt;setStage(+b.dataset.stage)));

    const assumed=()=&gt;({vp:+root.querySelector(&#x27;#vp-v2&#x27;).value,vs:+root.querySelector(&#x27;#vs-v2&#x27;).value});
    function inferredDistances(){const {vp,vs}=assumed();return picks.map(q=&gt;(q.s-q.p)/(1/vs-1/vp));}
    function waveformValue(t,i){
      const att=+root.querySelector(&#x27;#atten-v2&#x27;).value,noise=+root.querySelector(&#x27;#noise-v2&#x27;).value;
      const A=Math.exp(-att*dTrue[i]/62), p=arrivals[i].p,s=arrivals[i].s;
      const packet=(c,f,w,a)=&gt;a*Math.sin((t-c)*f)*Math.exp(-Math.pow((t-c)/w,2));
      const deterministic=(Math.sin(7.31*t+i*2.2)+.55*Math.sin(15.7*t+i*.7)+.28*Math.sin(29.2*t+i*1.4))*noise*.055;
      return deterministic+A*(packet(p,8.8,.58,.38)+packet(s,6.5,.9,.82));
    }
    function drawWaveforms(){
      const svg=root.querySelector(&#x27;#waveform-svg-v2&#x27;);svg.innerHTML=&#x27;&#x27;;const L=64,R=694,T=12,row=72,minT=5,maxT=27,x=t=&gt;L+(t-minT)/(maxT-minT)*(R-L);
      svg.append(E(&#x27;rect&#x27;,{x:L,y:T-5,width:R-L,height:287,class:&#x27;frame&#x27;}));
      [5,10,15,20,25].forEach(v=&gt;{svg.append(E(&#x27;line&#x27;,{x1:x(v),y1:T-5,x2:x(v),y2:T+282,class:&#x27;gridline&#x27;}));svg.append(E(&#x27;text&#x27;,{x:x(v),y:316,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,class:&#x27;axis-label&#x27;},v));});
      sensorsMM.forEach((s,i)=&gt;{const y=T+34+i*row;svg.append(E(&#x27;line&#x27;,{x1:L,y1:y,x2:R,y2:y,class:&#x27;gridline&#x27;}));svg.append(E(&#x27;text&#x27;,{x:L-13,y:y+4,&#x27;text-anchor&#x27;:&#x27;end&#x27;,class:&#x27;label&#x27;},s.id));const pts=[];for(let k=0;k&lt;=700;k++){const tt=minT+(maxT-minT)*k/700;pts.push([x(tt),y-waveformValue(tt,i)*29]);}svg.append(E(&#x27;path&#x27;,{d:path(pts),class:&#x27;wave&#x27;}));addPick(svg,i,&#x27;p&#x27;,x,picks[i].p,y,row);addPick(svg,i,&#x27;s&#x27;,x,picks[i].s,y,row);});
      svg.append(E(&#x27;text&#x27;,{x:(L+R)/2,y:333,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,class:&#x27;axis-label&#x27;},&#x27;time after record start (μs)&#x27;));
    }
    function addPick(svg,i,type,xScale,value,y,row){
      const cls=type===&#x27;p&#x27;?&#x27;p-pick&#x27;:&#x27;s-pick&#x27;, xp=xScale(value),lab=type.toUpperCase();
      const line=E(&#x27;line&#x27;,{x1:xp,y1:y-row*.37,x2:xp,y2:y+row*.37,class:cls});svg.append(line);const label=E(&#x27;text&#x27;,{x:xp+5,y:y-row*.27,class:&#x27;label&#x27;},lab);svg.append(label);
      const hit=E(&#x27;rect&#x27;,{x:xp-12,y:y-row*.44,width:24,height:row*.88,rx:4,class:&#x27;pick-hit cursor-interaction&#x27;,&#x27;data-i&#x27;:i,&#x27;data-type&#x27;:type,role:&#x27;slider&#x27;,tabindex:&#x27;0&#x27;,&#x27;aria-label&#x27;:`${sensorsMM[i].id} ${lab} arrival pick`,&#x27;aria-valuemin&#x27;:&#x27;5&#x27;,&#x27;aria-valuemax&#x27;:&#x27;27&#x27;,&#x27;aria-valuenow&#x27;:value.toFixed(2)});svg.append(hit);
      let dragging=false;
      const updateVisual=()=&gt;{const nx=xScale(picks[i][type]);line.setAttribute(&#x27;x1&#x27;,nx);line.setAttribute(&#x27;x2&#x27;,nx);label.setAttribute(&#x27;x&#x27;,nx+5);hit.setAttribute(&#x27;x&#x27;,nx-12);hit.setAttribute(&#x27;aria-valuenow&#x27;,picks[i][type].toFixed(2));};
      const setPick=(t,redraw=false)=&gt;{picks[i][type]=clamp(t,5,27);if(picks[i].s&lt;picks[i].p+.5){if(type===&#x27;p&#x27;)picks[i].p=picks[i].s-.5;else picks[i].s=picks[i].p+.5}estimate=null;cloud=[];if(redraw)drawLoc();else updateVisual();};
      const updateFromPointer=e=&gt;{const r=svg.getBoundingClientRect(),xx=(e.clientX-r.left)/r.width*720,t=5+(xx-64)/(694-64)*22;setPick(t)};
      hit.addEventListener(&#x27;pointerdown&#x27;,e=&gt;{dragging=true;e.preventDefault();hit.setPointerCapture(e.pointerId);updateFromPointer(e)});
      hit.addEventListener(&#x27;pointermove&#x27;,e=&gt;{if(!dragging)return;e.preventDefault();updateFromPointer(e)});
      const stop=e=&gt;{if(!dragging)return;dragging=false;if(e.pointerId!==undefined&amp;&amp;hit.hasPointerCapture(e.pointerId))hit.releasePointerCapture(e.pointerId);drawLoc()};
      hit.addEventListener(&#x27;pointerup&#x27;,stop);hit.addEventListener(&#x27;pointercancel&#x27;,stop);hit.addEventListener(&#x27;lostpointercapture&#x27;,()=&gt;dragging=false);
      hit.addEventListener(&#x27;keydown&#x27;,e=&gt;{if(e.key!==&#x27;ArrowLeft&#x27;&amp;&amp;e.key!==&#x27;ArrowRight&#x27;)return;e.preventDefault();setPick(picks[i][type]+(e.key===&#x27;ArrowRight&#x27;?.1:-.1),true)});
    }
    function updateDistanceCards(){const d=inferredDistances(),box=root.querySelector(&#x27;#distance-grid-v2&#x27;);box.innerHTML=&#x27;&#x27;;d.forEach((v,i)=&gt;{const c=document.createElement(&#x27;div&#x27;);c.className=&#x27;card&#x27;;c.innerHTML=`&lt;span&gt;${sensorsMM[i].id}: Δt = ${fmt(picks[i].s-picks[i].p,2)} μs&lt;/span&gt;&lt;strong&gt;r = ${fmt(v,1)} mm&lt;/strong&gt;`;box.append(c)});}
    function checkPicks(){const errs=picks.flatMap((q,i)=&gt;[Math.abs(q.p-arrivals[i].p),Math.abs(q.s-arrivals[i].s)]),mean=errs.reduce((a,v)=&gt;a+v,0)/errs.length;root.querySelector(&#x27;#loc-status-v2&#x27;).textContent=mean&lt;.22?&#x27;Picks are consistent. Continue to convert P–S time into distance.&#x27;:`Mean pick error ${fmt(mean,2)} μs. Refine the onset markers or continue to see its effect.`;}
    function solve(){
      const d=inferredDistances();let best={mis:Infinity,x:0,y:0};const all=[];
      for(let x=1;x&lt;=49;x+=1){for(let y=2;y&lt;=98;y+=2){const residual=sensorsMM.map((s,i)=&gt;Math.hypot(x-s.x,y-s.y)-d[i]);const mis=Math.sqrt(residual.reduce((a,v)=&gt;a+v*v,0)/residual.length);all.push({x,y,mis});if(mis&lt;best.mis)best={x,y,mis};}}
      estimate={x:best.x,y:best.y,mis:best.mis};const tol=1.1+2.2*(+root.querySelector(&#x27;#noise-v2&#x27;).value);cloud=all.filter(q=&gt;q.mis&lt;=best.mis+tol);root.querySelector(&#x27;#loc-status-v2&#x27;).textContent=`Best circle intersection: x ${fmt(best.x,1)} mm, y ${fmt(best.y,1)} mm; distance misfit ${fmt(best.mis,1)} mm.`;drawSpecimen();
    }
    function drawSpecimen(){
      const svg=root.querySelector(&#x27;#specimen-svg-v2&#x27;);svg.innerHTML=&#x27;&#x27;;const box={x:118,y:18,w:165,h:330},px=p=&gt;({x:box.x+p.x/50*box.w,y:box.y+(100-p.y)/100*box.h});const clip=&#x27;specimen-clip-v2&#x27;;const defs=E(&#x27;defs&#x27;),cp=E(&#x27;clipPath&#x27;,{id:clip});cp.append(E(&#x27;rect&#x27;,{x:box.x,y:box.y,width:box.w,height:box.h,rx:82}));defs.append(cp);svg.append(defs);svg.append(E(&#x27;rect&#x27;,{x:box.x,y:box.y,width:box.w,height:box.h,rx:82,class:&#x27;frame&#x27;}));
      const d=inferredDistances(),scale=box.w/50;
      if(stage&gt;=2)sensorsMM.forEach((s,i)=&gt;{const p=px(s),rad=Math.max(0,d[i]*scale);svg.append(E(&#x27;circle&#x27;,{cx:p.x,cy:p.y,r:rad,class:&#x27;annulus&#x27;,&#x27;clip-path&#x27;:`url(#${clip})`}));svg.append(E(&#x27;circle&#x27;,{cx:p.x,cy:p.y,r:rad,class:&#x27;range-circle&#x27;,&#x27;clip-path&#x27;:`url(#${clip})`}));});
      cloud.forEach(q=&gt;{const p=px(q);svg.append(E(&#x27;circle&#x27;,{cx:p.x,cy:p.y,r:2.3,class:&#x27;uncertainty&#x27;,&#x27;clip-path&#x27;:`url(#${clip})`}))});
      sensorsMM.forEach((s,i)=&gt;{const p=px(s);svg.append(E(&#x27;circle&#x27;,{cx:p.x,cy:p.y,r:8,class:&#x27;sensor&#x27;}));svg.append(E(&#x27;text&#x27;,{x:p.x+(s.x&lt;25?-13:13),y:p.y-10,&#x27;text-anchor&#x27;:s.x&lt;25?&#x27;end&#x27;:&#x27;start&#x27;,class:&#x27;label&#x27;},s.id));});
      if(estimate){const p=px(estimate);svg.append(E(&#x27;circle&#x27;,{cx:p.x,cy:p.y,r:10,class:&#x27;estimate&#x27;}));svg.append(E(&#x27;text&#x27;,{x:p.x+13,y:p.y+18,class:&#x27;label&#x27;},&#x27;estimate&#x27;));}
      if(reveal){const p=px(sourceMM);svg.append(E(&#x27;circle&#x27;,{cx:p.x,cy:p.y,r:9,class:&#x27;true-source&#x27;}));svg.append(E(&#x27;text&#x27;,{x:p.x+13,y:p.y-10,class:&#x27;label&#x27;},&#x27;true source&#x27;));}
      svg.append(E(&#x27;text&#x27;,{x:box.x+box.w/2,y:378,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,class:&#x27;axis-label&#x27;},&#x27;50 mm × 100 mm section&#x27;));
